services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace
    ports:
      # Host port 5433 to avoid colliding with a locally installed Postgres on 5432.
      - "5433:5432"
    healthcheck:
      # --wait in `docker compose up -d --wait` blocks until this passes, so
      # `prisma migrate deploy` never races an unready database.
      test: ["CMD-SHELL", "pg_isready -U workspace -d workspace"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
